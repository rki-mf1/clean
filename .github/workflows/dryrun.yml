name: Dry run
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:


env:
  NXF_ANSI_LOG: false

jobs:
  test:
    name: Dry run ${{ matrix.inputtype }}-${{ matrix.profile }}-nf_${{ matrix.NXF_VER }} pipeline test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        NXF_VER:
          - "23.04.1"
          # pinned instead of "latest": the strict syntax of Nextflow >=26.04
          # rejects the top-level statements in clean.nf, see issue #125
          - "25.10.0"
        inputtype:
          - fasta
          - illumina
          - nanopore
        profile: ["docker", "conda"] # TODO "singularity"]
        python-version:
          - "3.9"
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: /usr/local/bin/nextflow
          key: ${{ runner.os }}
          restore-keys: |
            ${{ runner.os }}-nextflow-

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "${{ matrix.NXF_VER }}"

      # The install script resolved the latest release through the
      # unauthenticated GitHub API, which is rate limited on shared runners and
      # failed the job with `curl: (22) The requested URL returned error: 403`.
      # This action takes a pinned version, so it needs no API call, and it
      # caches the download in the tool cache.
      - name: Install nf-test
        uses: nf-core/setup-nf-test@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: "0.9.5"

      - name: Set up Singularity
        if: matrix.profile == 'singularity'
        uses: eWaterCycle/setup-singularity@v7
        with:
          singularity-version: 3.7.1

      - name: Set up miniconda
        if: matrix.profile == 'conda'
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          conda-solver: libmamba
          channels: conda-forge,bioconda
          python-version: ${{ matrix.python-version }}

      - name: Run nf-test
        run: nf-test test --profile=${{ matrix.profile }} tests/${{ matrix.inputtype }}/*.nf.test --tap=test.tap

      - uses: pcolby/tap-summary@v1
        with:
          path: >-
            test.tap
